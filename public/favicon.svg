<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="scRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.65" />
    </linearGradient>

    <!-- Core Teal-Cyan Brand Gradient -->
    <linearGradient id="scBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="scRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Craft Sparkle -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Crisp Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base with Dual Rim Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#scBg)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#scRadial)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#scRim)" stroke-width="12" />

  <!-- Acoustic Voice Waveform Resonance Bars (Left & Right) -->
  <g fill="url(#scBrand)" opacity="0.9">
    <!-- Outer Left Bar -->
    <rect x="68" y="228" width="32" height="64" rx="16" />
    <!-- Mid Left Bar -->
    <rect x="120" y="180" width="36" height="156" rx="18" />
    <!-- Mid Right Bar -->
    <rect x="356" y="180" width="36" height="156" rx="18" />
    <!-- Outer Right Bar -->
    <rect x="412" y="228" width="32" height="64" rx="16" />
  </g>

  <!-- Central Studio Condenser Microphone Emblem -->
  <g filter="url(#softShadow)">
    <!-- Mic Capsule Body -->
    <rect x="202" y="104" width="108" height="184" rx="54" fill="url(#scBrand)" />

    <!-- Specular Highlight Curve -->
    <path d="M 218 132 C 218 116, 238 110, 256 110 C 274 110, 294 116, 294 132" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Acoustic Capsule Mesh Grille Accent -->
    <line x1="204" y1="192" x2="308" y2="192" stroke="#042f2e" stroke-width="14" stroke-linecap="round" opacity="0.45" />

    <!-- Capsule Sound Aperture Slits -->
    <circle cx="256" cy="150" r="10" fill="#042f2e" opacity="0.4" />

    <!-- U-Shaped Shockmount / Sound Arc -->
    <path d="M 174 200 C 174 296, 338 296, 338 200" fill="none" stroke="url(#scBrand)" stroke-width="28" stroke-linecap="round" />

    <!-- Mic Stem / Connector -->
    <line x1="256" y1="288" x2="256" y2="360" stroke="url(#scBrand)" stroke-width="28" stroke-linecap="round" />

    <!-- Base Pod Stand -->
    <line x1="194" y1="376" x2="318" y2="376" stroke="url(#scBrand)" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- 4-Point Craft Star (Speech Mastery Accent) -->
  <path d="M 384 64 Q 384 104 344 104 Q 384 104 384 144 Q 384 104 424 104 Q 384 104 384 64 Z" fill="url(#goldSpark)" filter="url(#softShadow)" />
</svg>
