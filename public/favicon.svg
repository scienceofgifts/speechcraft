<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="scRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Core Teal-Cyan Brand Gradient -->
    <linearGradient id="scBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="scRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Craft Sparkle -->
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Crisp Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base with Dual Rim Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#scBg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#scRadial)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#scRim)" stroke-width="1.75" />

  <!-- Acoustic Voice Waveform Resonance Bars (Left & Right) -->
  <g fill="url(#scBrand)" opacity="0.85">
    <!-- Outer Left Bar -->
    <rect x="8" y="28" width="4" height="8" rx="2" />
    <!-- Mid Left Bar -->
    <rect x="15" y="22" width="4.5" height="20" rx="2.25" />
    <!-- Mid Right Bar -->
    <rect x="44.5" y="22" width="4.5" height="20" rx="2.25" />
    <!-- Outer Right Bar -->
    <rect x="52" y="28" width="4" height="8" rx="2" />
  </g>

  <!-- Central Studio Condenser Microphone Emblem -->
  <g filter="url(#softShadow)">
    <!-- Mic Capsule Body -->
    <rect x="25" y="12" width="14" height="24" rx="7" fill="url(#scBrand)" />

    <!-- Specular Highlight Curve -->
    <path d="M 27 16 C 27 14, 30 13, 32 13 C 34 13, 37 14, 37 16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />

    <!-- Acoustic Capsule Mesh Grille Accent -->
    <line x1="25.5" y1="23" x2="38.5" y2="23" stroke="#042f2e" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

    <!-- Capsule Sound Aperture Slits -->
    <circle cx="32" cy="18" r="1.2" fill="#042f2e" opacity="0.4" />

    <!-- U-Shaped Shockmount / Sound Arc -->
    <path d="M 21.5 25 C 21.5 37, 42.5 37, 42.5 25" fill="none" stroke="url(#scBrand)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mic Stem / Connector -->
    <line x1="32" y1="36" x2="32" y2="45" stroke="url(#scBrand)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Base Pod Stand -->
    <line x1="24" y1="47" x2="40" y2="47" stroke="url(#scBrand)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 4-Point Craft Star (Speech Mastery Accent) -->
  <path d="M 48 8 Q 48 13 43 13 Q 48 13 48 18 Q 48 13 53 13 Q 48 13 48 8 Z" fill="url(#goldSpark)" filter="url(#softShadow)" />
</svg>
